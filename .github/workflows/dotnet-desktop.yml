name: .NET Desktop Build

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: ZMKSplit.sln
      Project_Name: ZMKSplit.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore NuGet packages
      run: dotnet restore $env:Solution_Name

    # 自己完結型(Self-contained)かつ1ファイル(SingleFile)でビルド
    - name: Publish Portable Executable
      run: |
        dotnet publish ${{ env.Project_Name }} `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishReadyToRun=true `
          -o ./publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ZMKSplit-Portable
        path: ./publish/ZMKSplit.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: ZMKSplit-Portable
        path: release-files
    
    - name: Create release archive
      run: |
        Compress-Archive -Path "release-files\ZMKSplit.exe" -DestinationPath "ZMKSplit-${{ github.ref_name }}.zip"
      shell: powershell
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: ZMKSplit ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ZMKSplit-${{ github.ref_name }}.zip
